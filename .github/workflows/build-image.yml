name: Build Docker Images

on:
  push:
    branches:
      - Retry_connection
  pull_request:
    branches:
      - Retry_connection

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CE Image
        run: |
          docker build -f Dockerfile -t jumpserver/chen:dev-ce .

      - name: Build EE Image
        run: |
          docker build -f Dockerfile-ee -t jumpserver/chen-ee:dev .

      - name: Push to Aliyun
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login --username ${{ secrets.ALIYUN_USERNAME }} ${{ secrets.ALIYUN_REGION }} --password-stdin 
          docker tag jumpserver/chen:dev-ce ${{ secrets.ALIYUN_REGION }}/fit2cloud_nickyang0_0/chen:dev-ce
          docker push ${{ secrets.ALIYUN_REGION }}/fit2cloud_nickyang0_0/chen:dev-ce
          docker tag jumpserver/chen-ee:dev ${{ secrets.ALIYUN_REGION }}/fit2cloud_nickyang0_0/chen-ee:dev
          docker push ${{ secrets.ALIYUN_REGION }}/fit2cloud_nickyang0_0/chen-ee:dev
